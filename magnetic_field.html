<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <title>მაგნიტური ველის დინამიური სიმულაცია - XI კლასი</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 5px; color: #38bdf8; font-size: 24px; }
    p.desc { color: #94a3b8; font-size: 14px; max-width: 800px; text-align: center; margin-bottom: 20px; }

    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    canvas {
      background: #090d16;
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .controls {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      width: 290px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label { font-size: 14px; color: #cbd5e1; }

    select, button, input[type="range"] {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
    }

    button {
      background: #0284c7;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #0369a1; }

    .info-box {
      margin-top: 10px;
      padding: 10px;
      background: #0f172a;
      border-left: 4px solid #38bdf8;
      font-size: 13px;
      line-height: 1.4;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <h1>მაგნიტური ველის დინამიური სიმულაცია</h1>
  <p class="desc">ნაწილაკები და ისრები მოძრაობენ მაგნიტური ინდუქციის $\vec{B}$ ვექტორის გასწვრივ, რაც ნათლად აჩვენებს გრიგალური ველის ბრუნვასა და სუპერპოზიციას.</p>

  <div class="container">
    <canvas id="simCanvas" width="600" height="500"></canvas>

    <div class="controls">
      <h3>მართვის პანელი</h3>

      <div class="control-group">
        <label for="modeSelect">რეჟიმი:</label>
        <select id="modeSelect">
          <option value="single">1 გამტარი (გრიგალური ველი)</option>
          <option value="double">2 გამტარი (სუპერპოზიცია)</option>
        </select>
      </div>

      <hr style="border-color: #334155; width: 100%;">

      <div class="control-group">
        <label>გამტარი 1 დენი ($I_1$):</label>
        <select id="wire1Dir">
          <option value="1">ჩვენკენ (☉) - საათის ისრის საწინააღმდეგოდ</option>
          <option value="-1">ჩვენგან (⊗) - საათის ისრის მიმართულებით</option>
        </select>
      </div>

      <div class="control-group" id="wire2Group">
        <label>გამტარი 2 დენი ($I_2$):</label>
        <select id="wire2Dir">
          <option value="1">ჩვენკენ (☉)</option>
          <option value="-1" selected>ჩვენგან (⊗)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="speedSlider">მოძრაობის სიჩქარე:</label>
        <input type="range" id="speedSlider" min="1" max="5" value="2" step="0.5">
      </div>

      <div class="control-group">
        <label for="densitySlider">ნაწილაკების რაოდენობა:</label>
        <input type="range" id="densitySlider" min="150" max="500" value="300">
      </div>

      <div class="info-box" id="infoText">
        <b>გრიგალური ველი:</b> დააკვირდით, როგორ ბრუნავენ ნაწილაკები ჩაკეტილ ტრაექტორიაზე.
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

const modeSelect = document.getElementById('modeSelect');
const wire1Dir = document.getElementById('wire1Dir');
const wire2Dir = document.getElementById('wire2Dir');
const wire2Group = document.getElementById('wire2Group');
const speedSlider = document.getElementById('speedSlider');
const densitySlider = document.getElementById('densitySlider');
const infoText = document.getElementById('infoText');

let wires = [];
let particles = [];

function initParticles() {
  particles = [];
  const count = parseInt(densitySlider.value);
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      life: Math.random() * 100
    });
  }
}

function updateWires() {
  const mode = modeSelect.value;
  if (mode === 'single') {
    wire2Group.style.display = 'none';
    wires = [
      { x: canvas.width / 2, y: canvas.height / 2, current: parseFloat(wire1Dir.value) }
    ];
    infoText.innerHTML = "<b>გრიგალური ველი:</b> ნაწილაკების მოძრაობა აჩვენებს, რომ მაგნიტური ველის წირებს არ გააჩნიათ საწყისი და საბოლოო წერტილები.";
  } else {
    wire2Group.style.display = 'flex';
    wires = [
      { x: canvas.width / 2 - 100, y: canvas.height / 2, current: parseFloat(wire1Dir.value) },
      { x: canvas.width / 2 + 100, y: canvas.height / 2, current: parseFloat(wire2Dir.value) }
    ];
    infoText.innerHTML = "<b>სუპერპოზიციის პრინციპი:</b> დააკვირდით ნაწილაკების მოძრაობას გამტარებს შორის შუა არეში — ველები იკრიბებიან ვექტორულად!";
  }
}

modeSelect.addEventListener('change', updateWires);
wire1Dir.addEventListener('change', updateWires);
wire2Dir.addEventListener('change', updateWires);
densitySlider.addEventListener('input', initParticles);

function getBField(x, y) {
  let Bx = 0;
  let By = 0;

  wires.forEach(w => {
    let dx = x - w.x;
    let dy = y - w.y;
    let r2 = dx * dx + dy * dy;
    if (r2 < 400) r2 = 400; // 0-ზე გაყოფის თავიდან აცილება

    let Bmag = (1200 * w.current) / r2;
    Bx += -Bmag * dy;
    By += Bmag * dx;
  });

  return { Bx, By, mag: Math.hypot(Bx, By) };
}

function drawWires() {
  wires.forEach((w, idx) => {
    ctx.beginPath();
    ctx.arc(w.x, w.y, 20, 0, Math.PI * 2);
    ctx.fillStyle = '#1e293b';
    ctx.fill();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (w.current > 0) {
      // დენი ჩვენკენ (წერტილი)
      ctx.beginPath();
      ctx.arc(w.x, w.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444';
      ctx.fill();
    } else {
      // დენი ჩვენგან (ჯვარი)
      ctx.fillText('✕', w.x, w.y);
    }

    ctx.fillStyle = '#cbd5e1';
    ctx.fillText(`I${idx + 1}`, w.x, w.y - 30);
  });
}

function animate() {
  // ოდნავი ნახევრად გამჭვირვალე ფონი კვალის (Trail) ეფექტისთვის
  ctx.fillStyle = 'rgba(9, 13, 22, 0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const speedMult = parseFloat(speedSlider.value);

  particles.forEach(p => {
    const B = getBField(p.x, p.y);

    if (B.mag > 0.001) {
      // ნაწილაკის გადაადგილება B ვექტორის მიმართულებით
      const normBx = B.Bx / B.mag;
      const normBy = B.By / B.mag;

      const speed = Math.min(B.mag * 1.5, 4) * speedMult;

      p.x += normBx * speed;
      p.y += normBy * speed;
    }

    // თუ ნაწილაკი გავა ეკრანიდან ან ძალიან მიუახლოვდება გამტარს, რესტარტი
    let nearWire = wires.some(w => Math.hypot(p.x - w.x, p.y - w.y) < 15);

    if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height || nearWire) {
      p.x = Math.random() * canvas.width;
      p.y = Math.random() * canvas.height;
    }

    // ნაწილაკისა და პატარა ისრის დახატვა
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
    ctx.fillStyle = '#38bdf8';
    ctx.fill();
  });

  drawWires();

  requestAnimationFrame(animate);
}

updateWires();
initParticles();
animate();
</script>

</body>
</html>
